site_name: SOSTENIBILIDAD APLICADA AL SISTEMA PRODUCTIVO
site_url: https://JoseAngelSeveroOchoa.github.io/Sostenibilidad/

theme:
  name: material
  language: es

nav:
  - Inicio: index.md
  - UD01_Sostenibilidad: UD01_Sostenibilidad.md
  - UD01_Sostenibilidad_Ejercicio: UD01_Sostenibilidad_Ejercicio.md

markdown_extensions:
